<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AuraStore</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo
                        secondary: '#a855f7', // Purple
                        accent: '#f43f5e', // Rose
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col antialiased relative overflow-x-hidden h-full">

    <!-- Glowing futuristic backdrops -->
    <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[140px] -z-10 animate-pulse duration-[8000ms]"></div>
    <div class="absolute top-1/2 -right-40 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px] -z-10"></div>
    <div class="absolute -bottom-40 left-1/3 w-[500px] h-[500px] bg-rose-500/5 rounded-full blur-[130px] -z-10"></div>

    <!-- Include the Navbar -->
    {% include 'front/share/navbar.html' %}

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-16 flex items-center justify-center relative z-10">
        
        <!-- Next-Gen Suspended Dark-Glass Panel -->
        <div class="w-full max-w-md bg-slate-900/40 backdrop-blur-2xl p-8 md:p-10 rounded-[32px] border border-slate-800/80 shadow-[0_0_50px_rgba(99,102,241,0.1)] space-y-6 my-8 relative overflow-hidden group">
            <!-- Glowing interactive border top -->
            <div class="absolute top-0 inset-x-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent"></div>
            
            <div class="text-center space-y-2 relative z-10">
                <h2 class="text-3xl font-extrabold text-white font-display tracking-tight">
                    Reset Password
                </h2>
                <p class="text-xs font-semibold text-slate-400 leading-relaxed">
                    Provide your register email address and we'll dispatch an automated key to restore full access.
                </p>
            </div>
            
            <form class="space-y-5 relative z-10">
                <!-- Email Address -->
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 font-display" for="email">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                        </span>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-800/60 bg-slate-950/50 focus:outline-none focus:ring-2 focus:ring-indigo-500/25 focus:border-indigo-500 text-sm font-medium text-white transition-all placeholder-slate-600 shadow-inner" placeholder="you@example.com" required>
                    </div>
                </div>
                
                <!-- Action Button -->
                <button type="submit" class="w-full py-3.5 px-4 font-extrabold rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500 hover:opacity-95 text-white transition-all duration-300 shadow-lg shadow-indigo-500/20 active:scale-[0.98] text-sm mt-8 font-display">
                    Send Reset Link
                </button>
            </form>
            
            <!-- Redirection Switcher -->
            <div class="text-center text-sm text-slate-400 font-semibold pt-2 relative z-10">
                Remembered your password? <a href="/login" class="font-extrabold text-indigo-400 hover:text-indigo-350 transition-colors">Back to Sign in</a>
            </div>
        </div>
    </main>

    <!-- Include the Footer -->
    {% include 'front/share/footer.html' %}

</body>

</html>
