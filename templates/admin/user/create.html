{% extends 'admin/master.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Header / Back Navigation -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="/admin/users" class="p-2 text-slate-400 hover:text-white bg-slate-900 border border-slate-800 rounded-xl transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold text-slate-100 font-display">Create New User</h1>
                <p class="text-xs text-slate-500">Register a new user account with role permissions and avatar image</p>
            </div>
        </div>
    </div>

    <!-- Create Form Card -->
    <div class="bg-cardBg border border-cardBorder rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <form action="/admin/users/create" method="POST" enctype="multipart/form-data" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        Full Name <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" name="fullname" required class="w-full pl-10 pr-4 py-3 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50" placeholder="e.g. Sophea Preab">
                    </div>
                </div>

                <!-- Email Address -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        Email Address <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="email" name="email" required class="w-full pl-10 pr-4 py-3 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50" placeholder="e.g. admin@aurastore.com">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        Password <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" name="password" required class="w-full pl-10 pr-4 py-3 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50" placeholder="••••••••">
                    </div>
                </div>

                <!-- Permission Role -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        System Permission Role <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i data-lucide="shield" class="w-4 h-4"></i>
                        </span>
                        <select name="role" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
                            <option value="Customer">Standard Customer</option>
                            <option value="Staff">Staff Member</option>
                            <option value="Administrator">Administrator Privileges</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Account Status -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        Account Status <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i data-lucide="activity" class="w-4 h-4"></i>
                        </span>
                        <select name="status" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <!-- Profile Image Upload -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 font-display">
                        Profile Image <span class="text-slate-600 font-normal">(PNG, JPG, WEBP)</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <img id="avatarPreview" src="" class="w-10 h-10 rounded-full object-cover border border-indigo-500/30 hidden shrink-0" alt="Preview">
                        <input type="file" id="imageInput" name="image" accept="image/*" onchange="previewImage(event)" class="w-full px-4 py-2 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/20 file:text-indigo-400 hover:file:bg-indigo-600/30 focus:outline-none">
                    </div>
                </div>
            </div>

            <script>
                function previewImage(event) {
                    const input = event.target;
                    const preview = document.getElementById('avatarPreview');
                    if (input.files && input.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            preview.src = e.target.result;
                            preview.classList.remove('hidden');
                        }
                        reader.readAsDataURL(input.files[0]);
                    }
                }
            </script>

            <!-- Form Actions -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-900">
                <a href="/admin/users" class="px-5 py-2.5 rounded-xl border border-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-900 text-xs font-bold font-display transition-all">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-indigo-600/20 hover:scale-[1.01] transition-all font-display">
                    Save User Profile
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
