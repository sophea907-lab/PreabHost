{% extends 'admin/master.html' %}

{% block content %}
<!-- ================= PRODUCTS CRUD TAB ================= -->
<div id="tab-products" class="tab-content space-y-6">
    <!-- Toolbar Area -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-cardBg border border-cardBorder p-4 rounded-2xl">
        <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="relative w-full max-w-sm">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="productSearch" oninput="filterProducts()" class="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500/50" placeholder="Search catalog by name or category...">
            </div>
            <select id="productCatFilter" onchange="filterProducts()" class="px-4 py-2 text-xs rounded-xl bg-slate-950 border border-slate-800 text-slate-400 focus:outline-none">
                <option value="ALL">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="jewelery">Jewelery</option>
                <option value="men's clothing">Men's Clothing</option>
                <option value="women's clothing">Women's Clothing</option>
            </select>
        </div>
        <button onclick="openAddProductModal()" class="px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-indigo-600/20 hover:scale-[1.01] transition-all flex items-center gap-1.5 self-start sm:self-auto font-display">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>Add New Product</span>
        </button>
    </div>

    <!-- Products Table -->
    <div class="bg-cardBg border border-cardBorder rounded-2xl overflow-hidden shadow-xl shadow-black/10">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="bg-slate-950/45 border-b border-slate-800 text-slate-400 font-bold uppercase tracking-wider">
                        <th class="py-3 px-6 w-16">ID</th>
                        <th class="py-3 px-6 w-16">Visual</th>
                        <th class="py-3 px-6">Product Title</th>
                        <th class="py-3 px-6">Category</th>
                        <th class="py-3 px-6">Price</th>
                        <th class="py-3 px-6">Rating</th>
                        <th class="py-3 px-6 text-center w-28">Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody" class="divide-y divide-slate-800/40 text-slate-300">
                    <!-- Rendered via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
