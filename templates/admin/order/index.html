{% extends 'admin/master.html' %}

{% block content %}
<!-- ================= ORDER CENTER TAB ================= -->
<div id="tab-orders" class="tab-content space-y-6">
    <div class="bg-cardBg border border-cardBorder rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="bg-slate-950/45 border-b border-slate-800 text-slate-400 font-bold uppercase tracking-wider">
                        <th class="py-4 px-6 w-16">ID</th>
                        <th class="py-4 px-6">Buyer Details</th>
                        <th class="py-4 px-6">Delivery Destination</th>
                        <th class="py-4 px-6">Purchased Items</th>
                        <th class="py-4 px-6">Financials</th>
                        <th class="py-4 px-6 w-36">Status Controls</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="divide-y divide-slate-800/40 text-slate-300">
                    <!-- Rendered via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
