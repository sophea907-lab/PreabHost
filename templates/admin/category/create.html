{% extends 'admin/master.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <!-- Breadcrumb & Header -->
    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-500 font-semibold mb-1">
                <a href="/admin/categories" class="hover:text-indigo-400 transition-colors">Categories</a>
                <span>/</span>
                <span class="text-slate-300">Create</span>
            </div>
            <h1 class="text-xl font-black text-slate-100 font-display">Add New Category</h1>
        </div>
        <a href="/admin/categories" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 border border-slate-800">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back to Categories</span>
        </a>
    </div>

    <!-- Form Card -->
    <div class="bg-cardBg border border-cardBorder rounded-2xl p-6 md:p-8 shadow-xl">
        <form action="/admin/categories/create" method="POST" enctype="multipart/form-data" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Name -->
            <div>
                <label for="name" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 font-display">Category Name <span class="text-rose-500">*</span></label>
                <input type="text" id="name" name="name" required placeholder="e.g. Smart Electronics, Fine Jewelry" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
            </div>

            <!-- Image Upload -->
            <div class="space-y-2">
                <label for="image" class="block text-xs font-bold text-slate-300 uppercase tracking-wider font-display">Category Image / Banner</label>
                <input type="file" id="image" name="image" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600/20 file:text-indigo-400 hover:file:bg-indigo-600/30 file:cursor-pointer cursor-pointer bg-slate-950 border border-slate-800 rounded-xl p-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
                <p class="text-[11px] text-slate-500">Supports PNG, JPG, JPEG, WEBP or GIF formats.</p>
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 font-display">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Brief summary of what products belong in this category..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50"></textarea>
            </div>

            <!-- Actions -->
            <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
                <a href="/admin/categories" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs font-bold transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-indigo-600/20 hover:scale-[1.01] transition-all flex items-center gap-2 font-display">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Save Category</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
